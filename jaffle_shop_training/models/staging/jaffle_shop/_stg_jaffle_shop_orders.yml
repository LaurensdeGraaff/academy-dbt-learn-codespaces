version: 2

models:
  - name: stg_jaffle_shop_orders
    columns: 
      - name: customer_id
        data_tests:
        - relationships:
            to: ref('stg_jaffle_shop_customers')
            field: customer_id
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              values:
                - returned
                - completed
                - shipped
                - return_pending
                - placed
                - completed
      - name: order_id
        data_tests:
          - unique
          - not_null    
