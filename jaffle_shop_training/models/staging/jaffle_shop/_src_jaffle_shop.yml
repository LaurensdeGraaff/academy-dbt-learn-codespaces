version: 2 

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop 
    tables:
      - name: customers
        identifier: customers 
      - name: orders
        identifier: orders
        loaded_at: _etl_loaded_at
        freshness: 
          error_after:
            count: 50000
            period: hour
          warn_after:
            count: 12
            period: hour

    
    