version: 2 

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop 
    tables:
      - name: customers
        identifier: customers 
        columns:
          - name: id
            identifier: id
            data_tests:
              - unique
              - not_null
          - name: name
          - name: email
          - name: phone
          - name: created_at
          - name: updated_at
      - name: orders
        identifier: orders
        loaded_at_field: _etl_loaded_at
        freshness: 
          error_after:
            count: 48
            period: hour
          warn_after:
            count: 12
            period: hour

    
    