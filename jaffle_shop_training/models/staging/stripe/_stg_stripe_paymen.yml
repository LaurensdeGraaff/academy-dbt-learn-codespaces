version: 2

models:
  - name: stg_stripe_payment
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: payment_status
        data_tests:
          - accepted_values:
              values: ['success','fail']
      - name: payment_method
        data_tests:
          - accepted_values:
              values: ['credit_card','coupon','bank_transfer','gift_card']