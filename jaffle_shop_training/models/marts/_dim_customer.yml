version: 2

models:
  - name: dim_customers
    description: one row per customer
    columns:
      - name: customer_id
        description: this is the primairy key for the customer
        data_tests:
          - unique
          - not_null
      - name: first_order_date
        description: the date of the first order
      - name: most_recent_order_date
        description: the date of the most recent order
      - name: number_of_orders
        description: the number of orders the customer has placed
      - name: lifetime_value
        description: the total amount of money (USD) the customer has spent